services:
  assets:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build -- --watch"
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vino_costero
      POSTGRES_USER: vino
      POSTGRES_PASSWORD: vino_secret
    ports:
      - "5432:5432"
    volumes:
      - vino_costero_postgres:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - assets
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: vino_costero
      DB_USERNAME: vino
      DB_PASSWORD: vino_secret
      DB_CHARSET: utf8
      DB_COLLATION: default
      APP_KEY: base64:E/EqeijE9jdH01V+w+EIrGCGVMZ2glHft3SbLthen4A=
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8081
      SESSION_DRIVER: file
      CACHE_STORE: file
    ports:
      - "8081:8080"
    volumes:
      - .:/app
      - /app/vendor

volumes:
  vino_costero_postgres:
